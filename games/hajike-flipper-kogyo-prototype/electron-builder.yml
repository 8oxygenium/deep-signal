appId: com.hansode.hajikeflipperkogyo
# 表示名は日本語。実行ファイル名だけは英字にする（コマンドやツールで扱いやすく、壊れにくい）
productName: 弾け！フリッパー興業
executableName: Hajike-Flipper-Kogyo
electronLanguages: [ja, en-US]
copyright: Copyright (C) HANSODE
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
  # koffi は Windows x64 用のバイナリだけ同梱する
  - "!node_modules/@koromix/koffi-{linux,darwin,freebsd,openbsd,android}*/**"
asarUnpack:
  - "node_modules/koffi/**"
  - "node_modules/@koromix/**"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Hajike-Flipper-Kogyo-Setup.${ext}
  legalTrademarks: HANSODE
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 弾け！フリッパー興業
  uninstallDisplayName: 弾け！フリッパー興業
  artifactName: Hajike-Flipper-Kogyo-Setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  language: "1041"
  installerLanguages: [ja_JP]
publish: null
